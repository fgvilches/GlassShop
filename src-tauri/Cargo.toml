[package]
name = "app"
version = "1.1.1"
description = "GlassShop — Liquid Glass download manager for hShop"
authors = ["Felipe González"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
scraper = "0.21"
sha2 = "0.10"
hex = "0.4"
regex = "1"
once_cell = "1"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
